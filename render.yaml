services:
  - type: web
    name: siteops-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free plan sleeps after ~15 min idle, which pauses the in-process
    # schedulers in backend/app/main.py (daily task prompts, gate/meeting
    # reminders, weekly summaries, evidence retention, outbox dispatch) and
    # slows the WhatsApp inbound webhook's first response after a sleep.
    # Mitigate with an external keep-alive hitting /api/health every
    # ~10 minutes (e.g. cron-job.org, UptimeRobot). No persistent disk is
    # needed: evidence lives in Supabase Storage (app.services.evidence_storage),
    # not on this container's filesystem.
    plan: free
    # Matches the Supabase project's ap-south-1 (Mumbai) region - Singapore
    # is Render's closest region, keeping backend<->DB latency low.
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_SUPER_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPER_ADMIN_PASSWORD
        sync: false
      - key: MIGRATION_TEMP_PASSWORD
        sync: false
