services:
  backend:
    build: ./backend
    container_name: siteops_mvp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@host.docker.internal:15432/postgres}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://192.168.8.11:3000
      UPLOAD_DIR: uploads/task-proofs
      SUPABASE_URL: ${SUPABASE_BACKEND_URL:-http://host.docker.internal:15431}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      MIGRATION_TEMP_PASSWORD: ${MIGRATION_TEMP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - siteops_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://127.0.0.1:15431}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    container_name: siteops_mvp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  siteops_uploads:
