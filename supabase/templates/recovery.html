<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:20px;padding:32px;border:1px solid #e2e8f0">
          <tr><td>
            <p style="margin:0 0 12px;color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Secure account recovery</p>
            <h1 style="margin:0 0 12px;font-size:28px">Choose your SiteOps password</h1>
            <p style="margin:0 0 24px;color:#475569;line-height:1.6">Use this one-time link to create or reset your password. The link expires in one hour.</p>
            <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;border-radius:12px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px">Set password</a>
            <p style="margin:24px 0 0;color:#94a3b8;font-size:12px;line-height:1.5">If you did not request this, ignore this email. Only the newest link will work.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
